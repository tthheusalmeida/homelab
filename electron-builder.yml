# Empacotamento do HomeLab (fase 10). Só Windows x64 por enquanto; sem assinatura de código.
appId: homelab
productName: HomeLab
copyright: HomeLab
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-renderer/**
  - package.json
asar: true
# Binários nativos ficam fora do asar (precisam ser executados): <app>/resources/bin/<plataforma>-<arch>.
# O modelo do Whisper (.bin) não entra no instalador; o usuário informa em Configurações.
extraResources:
  - from: resources/bin/win32-x64
    to: bin/win32-x64
    filter:
      - '**/*'
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: HomeLab-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: HomeLab
