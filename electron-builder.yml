# Empacotamento do HomeLab. Cada sistema tem o seu instalador, com só os binários do seu sistema,
# e é gerado no próprio sistema (ver docs/empacotamento.md). Hoje só o Windows x64 está pronto;
# sem assinatura de código.
appId: homelab
productName: HomeLab
copyright: HomeLab
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-renderer/**
  - package.json
asar: true
# Repositório dos Releases: o `electron-builder` gera `latest.yml`/`latest-linux.yml` e os `.blockmap`
# (lidos pelo atualizador do app) e embute o `app-update.yml`. Nunca publica sozinho: a CI usa
# `--publish never` e anexa os arquivos ao Release (.github/workflows/release.yml).
publish:
  provider: github
  owner: tthheusalmeida
  repo: homelab
  releaseType: release
# Binários nativos ficam fora do asar (precisam ser executados): <app>/resources/bin/<plataforma>-<arch>.
# O instalador é pequeno: modelos do Whisper (*.bin) e o pacote CUDA (DLLs de GPU NVIDIA, ~1 GB) não
# entram; o assistente de instalação do app baixa depois (o instalador NSIS não passa de ~2 GB).
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: HomeLab-Setup-${version}.${ext}
  extraResources:
    - from: resources/bin/win32-x64
      to: bin/win32-x64
      filter:
        - '**/*'
        - '!**/*.bin'
        - '!cublas*.dll'
        - '!cudart*.dll'
        - '!nvblas*.dll'
        - '!nvrtc*.dll'
        - '!ggml-cuda.dll'
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: HomeLab
# Linux: nada vai embutido. Os programas (ffmpeg, yt-dlp...) são baixados pelo assistente do app para
# a pasta de dados do usuário, porque o AppImage é somente leitura. Gere no próprio Linux.
# macOS: configuração pronta, mas ainda sem binários (resources/bin/darwin-arm64).
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
  artifactName: HomeLab-${version}.${ext}
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  artifactName: HomeLab-${version}-${arch}.${ext}
  extraResources:
    - from: resources/bin/darwin-arm64
      to: bin/darwin-arm64
      filter:
        - '**/*'
        - '!**/*.bin'
