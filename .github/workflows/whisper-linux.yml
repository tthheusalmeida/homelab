# Compila o whisper-cli para Linux x64 (estático, CPU) e publica no Release `components-v1`, de onde o
# assistente do app o baixa. Não há binário oficial para Linux. Rodar à mão (Actions > Run workflow);
# o resumo do job mostra tamanho e SHA-256 para colocar no catálogo (component-manifest.ts).
name: whisper-linux

on:
  workflow_dispatch:
    inputs:
      whisper_ref:
        description: Tag do whisper.cpp a compilar
        default: v1.9.5

permissions:
  contents: write

jobs:
  build:
    # Ubuntu mais antigo: o binário roda também em distribuições com glibc mais velha.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Build whisper-cli
        env:
          WHISPER_CPP_REF: ${{ inputs.whisper_ref }}
        run: scripts/build-whisper-linux.sh

      - name: Publish to the components-v1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view components-v1 >/dev/null 2>&1 || \
            gh release create components-v1 --title "Components v1" --notes "Binários e pacotes baixados pelo assistente do app."
          gh release upload components-v1 dist-components/whisper-cli-linux-x64 --clobber

      - name: Summary
        run: |
          file=dist-components/whisper-cli-linux-x64
          {
            echo "### whisper-cli-linux-x64"
            echo "- Tamanho: $(stat -c %s "$file") bytes"
            echo "- SHA-256: \`$(sha256sum "$file" | cut -d' ' -f1)\`"
            echo "- URL: https://github.com/${{ github.repository }}/releases/download/components-v1/whisper-cli-linux-x64"
          } >> "$GITHUB_STEP_SUMMARY"
